  // Eliminar un usuario está restringido al Administrador — verificado aquí a nivel lógico,
  // no solo ocultando el botón en la interfaz. Los casos que ese usuario haya creado NO se
  // tocan: quedan como registro histórico con su autoría original intacta.
  async function eliminarUsuarioPorId(idUsuario, confirmFn){
    if(!esAdministrador()){
      console.error("Eliminar usuario: usuario sin permiso de administrador intentó eliminar", idUsuario);
      toast("SOLO EL ADMINISTRADOR PUEDE ELIMINAR USUARIOS");
      return { ok:false, motivo:"sin_permiso" };
    }
    confirmFn = confirmFn || confirmarAccion;
    const usuario = USUARIOS.find(u=> u.id===idUsuario);
    if(!usuario){ console.error("Eliminar usuario: no se encontró", idUsuario); return { ok:false, motivo:"no_encontrado" }; }
    if(usuario.rol==="ADMINISTRADOR"){
      toast("NO SE PUEDE ELIMINAR AL ADMINISTRADOR DEL SISTEMA");
      return { ok:false, motivo:"es_administrador" };
    }
    if(!(await confirmFn("¿ESTÁ SEGURO DE ELIMINAR ESTE USUARIO?\n\nEsta acción no se puede deshacer."))){
      return { ok:false, motivo:"cancelado" };
    }
    const listaAnterior = USUARIOS;
    const listaNueva = USUARIOS.filter(u=> u.id!==idUsuario);
    try{
      await eliminarRegistro("usuarios", idUsuario);
      USUARIOS = listaNueva;
      toast("USUARIO ELIMINADO");
      return { ok:true };
    }catch(err){
      console.error("Error al eliminar el usuario:", err);
      USUARIOS = listaAnterior;
      toast("NO SE PUDO ELIMINAR EL USUARIO. INTENTA DE NUEVO.");
      return { ok:false, motivo:"error_guardado", error: err };
    }
  }

  function abrirModalUsuario(usuarioExistente){
    const esAdmin = usuarioExistente && usuarioExistente.rol==="ADMINISTRADOR";
    const back = document.createElement("div");
    back.className = "modal-backdrop";
    back.innerHTML = `
      <div class="modal" style="max-width:460px;">
        <div class="modal-header">
          <h3>${usuarioExistente ? "Editar usuario" : "Agregar usuario"}</h3>
          <button class="modal-close" id="mu-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="field"><label>Nombres</label><input type="text" id="mu-nombres" data-upper value="${usuarioExistente?usuarioExistente.nombres:""}" placeholder="EJ: CARLOS ANDRÉS"></div>
          <div class="field"><label>Apellidos</label><input type="text" id="mu-apellidos" data-upper value="${usuarioExistente?usuarioExistente.apellidos:""}" placeholder="EJ: LARA MOSQUERA"></div>
          <div class="field">
            <label>Tipo de usuario</label>
            ${esAdmin ? `<div class="hint">Este usuario es el administrador del sistema.</div>` : `
              <div class="segmented" id="mu-seg-rol">
                <button type="button" data-v="POSGRADISTA">POSGRADISTA</button>
                <button type="button" data-v="MÉDICO TRATANTE">TRATANTE</button>
              </div>
            `}
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="mu-cancel">Cancelar</button>
          <button class="btn-primary" id="mu-guardar">${usuarioExistente ? "Guardar cambios" : "Agregar usuario"}</button>
        </div>
      </div>`;
    document.body.appendChild(back);
    uppercaseInputs(back);
    document.getElementById("mu-close").addEventListener("click", ()=>back.remove());
    document.getElementById("mu-cancel").addEventListener("click", ()=>back.remove());
    back.addEventListener("click", (e)=>{ if(e.target===back) back.remove(); });

    let rol = usuarioExistente ? usuarioExistente.rol : "POSGRADISTA";
    const segRol = document.getElementById("mu-seg-rol");
    if(segRol){
      function paint(){ segRol.querySelectorAll("button").forEach(b=> b.classList.toggle("sel", b.dataset.v===rol)); }
      paint();
      segRol.addEventListener("click", e=>{ if(e.target.tagName==="BUTTON"){ rol=e.target.dataset.v; paint(); } });
    }

    document.getElementById("mu-guardar").addEventListener("click", async ()=>{
      const nombres = up(document.getElementById("mu-nombres").value);
      const apellidos = up(document.getElementById("mu-apellidos").value);
      if(!nombres || !apellidos){ toast("COMPLETA NOMBRES Y APELLIDOS"); return; }
      let usuarioAGuardar, esNuevo, estadoAnterior = null;
      if(usuarioExistente){
        estadoAnterior = { ...usuarioExistente };
        usuarioExistente.nombres = nombres;
        usuarioExistente.apellidos = apellidos;
        if(!esAdmin) usuarioExistente.rol = rol;
        usuarioAGuardar = usuarioExistente;
        esNuevo = false;
      } else {
        usuarioAGuardar = { id: generarIdUsuario(), nombres, apellidos, rol, activo:true };
        USUARIOS.push(usuarioAGuardar);
        esNuevo = true;
      }
      try{
        await guardarRegistro("usuarios", usuarioAGuardar);
        back.remove();
        toast(usuarioExistente ? "USUARIO ACTUALIZADO" : "USUARIO AGREGADO");
        renderUsuarios();
      }catch(err){
        console.error("Error al guardar el usuario:", err);
        if(esNuevo){ USUARIOS = USUARIOS.filter(u=> u.id!==usuarioAGuardar.id); }
        else{ Object.assign(usuarioExistente, estadoAnterior); }
        toast("NO SE PUDO GUARDAR EL USUARIO. INTENTA DE NUEVO.");
      }
    });
  }

  /* ============================= MODAL NUEVO CASO ============================= */
  function abrirModalCaso(casoExistente){
    const back = document.createElement("div");
    back.className = "modal-backdrop";
    back.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>${casoExistente ? "Editar caso" : "Agregar caso"}</h3>
          <button class="modal-close" id="mc-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="readonly-row">
            <div class="ro">
              <b>Fecha de ingreso</b>
              <input type="date" id="nc-fecha" value="${casoExistente ? casoExistente.fechaIngreso : todayISO()}"
                style="border:1px solid var(--border); border-radius:var(--radius); padding:4px 6px; font-size:12.5px; background:#fff; font-family:inherit; color:var(--ink);">
            </div>
            <div class="ro"><b>Hospital</b>${HOSPITAL}</div>
            ${casoExistente && esAdministrador() ? "" : `<div class="ro"><b>Aportado por</b>${casoExistente ? casoExistente.aportadoPor + " — " + casoExistente.rol : nombreCompletoPerfil() + " — " + PERFIL.rol}</div>`}
          </div>
          ${casoExistente && esAdministrador() ? `
          <div class="field">
            <label>Propietario del caso (solo el administrador puede cambiarlo)</label>
            <select id="nc-propietario">
              ${USUARIOS.filter(u=> u.activo || u.id===casoExistente.creadoPorId).map(u=> `<option value="${u.id}" ${u.id===casoExistente.creadoPorId?"selected":""}>${u.nombres} ${u.apellidos} — ${u.rol}</option>`).join("")}
            </select>
          </div>` : ""}
          <div class="row2">
            <div class="field"><label>HCL / Historia clínica</label><input type="text" id="nc-hcl" data-upper value="${casoExistente?casoExistente.hcl:""}" placeholder="EJ: 458721"></div>
            <div class="field"><label>Número de orden</label><input type="text" id="nc-orden" data-upper value="${casoExistente?casoExistente.orden:""}" placeholder="EJ: 2026-45897"></div>
          </div>
          <div class="field combo">
            <label>Tipo de estudio</label>
            <input type="text" id="nc-estudio" data-upper autocomplete="off" value="${casoExistente?casoExistente.estudio:""}" placeholder="Buscar o escribir un tipo de estudio…">
            <div id="nc-estudio-list"></div>
            <div class="hint">Si el estudio no existe, podrás crearlo y quedará disponible para todo el equipo.</div>
          </div>
          <div class="field combo">
            <label>Área del cuerpo</label>
            <input type="text" id="nc-area" data-upper autocomplete="off" value="${casoExistente?casoExistente.area:""}" placeholder="EJ: TÓRAX, CABEZA, ABDOMEN, PELVIS, TUMORAL, HUESO…">
            <div id="nc-area-list"></div>
          </div>
          <div class="field">
            <label>Diagnóstico o hallazgo relevante para enseñanza</label>
            <textarea id="nc-diagnostico" data-upper placeholder="EJ: SÍNDROME DE KARTAGENER">${casoExistente?casoExistente.diagnostico:""}</textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="mc-cancel">Cancelar</button>
          <button class="btn-primary" id="mc-guardar">${casoExistente ? "Guardar cambios" : "Guardar caso"}</button>
        </div>
      </div>`;
    document.body.appendChild(back);
    uppercaseInputs(back);
    document.getElementById("mc-close").addEventListener("click", ()=>back.remove());
    document.getElementById("mc-cancel").addEventListener("click", ()=>back.remove());
    back.addEventListener("click", (e)=>{ if(e.target===back) back.remove(); });

    let estudioSeleccionado = casoExistente ? casoExistente.estudio : "";
    const inputEstudio = document.getElementById("nc-estudio");
    const listEl = document.getElementById("nc-estudio-list");

    function pintarLista(){
      const q = inputEstudio.value.trim();
      const disponibles = estudiosDisponibles();
      if(!q){
        const frecuentes = estudiosFrecuentes();
        listEl.innerHTML = `<div class="combo-list">
          <div class="combo-group">FRECUENTES</div>
          ${frecuentes.map(e=>`<div class="combo-item" data-v="${e.nombre}">${e.nombre}</div>`).join("")}
          <div style="padding:9px 12px; font-size:11.5px; color:var(--ink-faint);">Escribe para buscar en todo el catálogo (${disponibles.length} estudios)…</div>
        </div>`;
      } else {
        const TOPE_RESULTADOS = 30;
        const todasLasCoincidencias = disponibles.filter(e=> coincideEstudio(e, q));
        const items = todasLasCoincidencias.slice(0, TOPE_RESULTADOS);
        const hayMas = todasLasCoincidencias.length > TOPE_RESULTADOS;
        const duplicado = buscarEstudioDuplicado(q, CATALOGO);
        listEl.innerHTML = `<div class="combo-list">
          ${items.length===0 ? `<div style="padding:10px 12px; font-size:12.5px; color:var(--ink-faint);">SIN COINCIDENCIAS EN EL CATÁLOGO</div>` : items.map(e=>`<div class="combo-item" data-v="${e.nombre}">${e.nombre}</div>`).join("")}
          ${hayMas ? `<div style="padding:7px 12px; font-size:11px; color:var(--ink-faint);">Mostrando los primeros ${TOPE_RESULTADOS} resultados — sigue escribiendo para afinar…</div>` : ""}
          ${duplicado
            ? `<div class="combo-create" id="nc-usar-existente" data-v="${duplicado.nombre}" style="color: var(--prioridad);">ESTE ESTUDIO YA EXISTE COMO: "${duplicado.nombre}" — usar estudio existente</div>`
            : `<div class="combo-create" id="nc-crear-estudio">+ Crear nuevo tipo de estudio: "${up(q)}"</div>`}
        </div>`;
      }
      listEl.querySelectorAll(".combo-item").forEach(it=>{
        it.addEventListener("click", ()=>{
          estudioSeleccionado = it.dataset.v;
          inputEstudio.value = it.dataset.v;
          listEl.innerHTML = "";
        });
      });
      const usarExistente = document.getElementById("nc-usar-existente");
      if(usarExistente){
        usarExistente.addEventListener("click", async ()=>{
          const nombre = usarExistente.dataset.v;
          const entrada = CATALOGO.find(e=> e.nombre===nombre);
          if(entrada && !entrada.activo){
            entrada.activo = true;
            try{ await guardarRegistro("catalogo_estudios", entrada); }
            catch(err){ console.error("Error al reactivar el estudio:", err); entrada.activo = false; toast("NO SE PUDO REACTIVAR EL ESTUDIO."); return; }
          }
          estudioSeleccionado = nombre;
          inputEstudio.value = nombre;
          listEl.innerHTML = "";
        });
      }
      const crear = document.getElementById("nc-crear-estudio");
      if(crear){
        crear.addEventListener("click", async ()=>{
          const nombre = up(inputEstudio.value);
          // Revalidación final justo antes de crear: si en el momento del clic ya existe
          // (por ejemplo, otro equipo lo creó mientras esta lista estaba abierta), se usa
          // el existente en vez de crear un duplicado.
          const duplicadoAlGuardar = buscarEstudioDuplicado(nombre, CATALOGO);
          if(duplicadoAlGuardar){
            if(!duplicadoAlGuardar.activo){
              duplicadoAlGuardar.activo = true;
              try{ await guardarRegistro("catalogo_estudios", duplicadoAlGuardar); }
              catch(err){ console.error("Error al reactivar el estudio:", err); duplicadoAlGuardar.activo=false; }
            }
            estudioSeleccionado = duplicadoAlGuardar.nombre;
            inputEstudio.value = duplicadoAlGuardar.nombre;
            listEl.innerHTML = "";
            return;
          }
          const modalidad = inferirCategoria(nombre) || "TOMOGRAFÍA";
          const copiaCategoriasAnterior = CATEGORIAS.slice();
          const nuevaEntrada = { id: generarIdEstudio(), nombre, modalidad, categoria:"GENERAL", activo:true, usos:0 };
          CATALOGO.push(nuevaEntrada);
          if(!CATEGORIAS.find(c=> c.nombre===modalidad)){ CATEGORIAS.push({ nombre:modalidad, activo:true }); }
          try{
            await guardarRegistro("catalogo_estudios", nuevaEntrada);
            await guardarCategorias(CATEGORIAS);
            estudioSeleccionado = nombre;
            toast("TIPO DE ESTUDIO AÑADIDO AL CATÁLOGO");
          }catch(err){
            console.error("Error al crear el tipo de estudio:", err);
            CATALOGO = CATALOGO.filter(e=> e.id!==nuevaEntrada.id);
            CATEGORIAS = copiaCategoriasAnterior;
            toast("NO SE PUDO CREAR EL ESTUDIO. INTENTA DE NUEVO.");
          }
          listEl.innerHTML = "";
        });
      }
    }
    inputEstudio.addEventListener("focus", pintarLista);
    inputEstudio.addEventListener("input", ()=>{ estudioSeleccionado=""; pintarLista(); });

    let areaSeleccionada = casoExistente ? casoExistente.area : "";
    const inputArea = document.getElementById("nc-area");
    const listElArea = document.getElementById("nc-area-list");
    function pintarListaArea(){
      const q = normKey(inputArea.value);
      const items = q ? AREAS.filter(a=> normKey(a).includes(q)) : AREAS;
      const existeExacto = AREAS.some(a=> normKey(a)===q);
      listElArea.innerHTML = `<div class="combo-list">
        ${items.map(a=>`<div class="combo-item" data-v="${a}">${a}</div>`).join("")}
        ${q && !existeExacto ? `<div class="combo-create" id="nc-crear-area">+ Crear nueva área: "${up(inputArea.value)}"</div>` : ""}
      </div>`;
      listElArea.querySelectorAll(".combo-item").forEach(it=>{
        it.addEventListener("click", ()=>{
          areaSeleccionada = it.dataset.v;
          inputArea.value = it.dataset.v;
          listElArea.innerHTML = "";
        });
      });
      const crearArea = document.getElementById("nc-crear-area");
      if(crearArea){
        crearArea.addEventListener("click", async ()=>{
          const nombre = up(inputArea.value);
          const yaExiste = AREAS.find(a=> normKey(a)===normKey(nombre));
          if(yaExiste){ areaSeleccionada = yaExiste; inputArea.value = yaExiste; }
          else{
            AREAS.push(nombre);
            await guardarAreas(AREAS);
            areaSeleccionada = nombre;
            toast("ÁREA AÑADIDA AL CATÁLOGO");
          }
          listElArea.innerHTML = "";
        });
      }
    }
    inputArea.addEventListener("focus", pintarListaArea);
    inputArea.addEventListener("input", ()=>{ areaSeleccionada=""; pintarListaArea(); });

    document.addEventListener("click", function outside(e){
      if(!back.isConnected){ document.removeEventListener("click", outside); return; }
      if(!e.target.closest(".combo")){ listEl.innerHTML = ""; listElArea.innerHTML = ""; }
    });

    document.getElementById("mc-guardar").addEventListener("click", async ()=>{
      if(casoExistente && !puedeEditarCaso(casoExistente)){
        console.error("Guardar caso: usuario sin permiso intentó editar", casoExistente.id, "usuario:", PERFIL && PERFIL.id);
        toast("NO TIENES PERMISO PARA EDITAR ESTE CASO");
        return;
      }
      const hcl = up(document.getElementById("nc-hcl").value);
      const orden = up(document.getElementById("nc-orden").value);
      const estudio = up(estudioSeleccionado || inputEstudio.value);
      const area = up(areaSeleccionada || inputArea.value);
      const diagnostico = up(document.getElementById("nc-diagnostico").value);
      // El input type="date" ya entrega el valor en "YYYY-MM-DD" en hora LOCAL, sin ninguna
      // conversión a UTC de por medio — si por algo llegara vacío, se usa la fecha local de hoy.
      const fechaIngreso = document.getElementById("nc-fecha").value || todayISO();

      if(!hcl || !estudio || !area || !diagnostico){
        toast("COMPLETA HCL, ESTUDIO, ÁREA Y DIAGNÓSTICO"); return;
      }

      const btnGuardar = document.getElementById("mc-guardar");

      // ---- 1) Mutaciones en memoria: instantáneas, no tocan la red ----
      const yaEnCatalogo = buscarEstudioDuplicado(estudio, CATALOGO);
      let entradaCatalogo = yaEnCatalogo;
      const esEntradaCatalogoNueva = !yaEnCatalogo;
      let categoriaNuevaRegistrada = false;
      const copiaCategoriasAnterior = CATEGORIAS.slice();
      if(!yaEnCatalogo){
        const modalidadNueva = inferirCategoria(estudio) || "TOMOGRAFÍA";
        entradaCatalogo = { id: generarIdEstudio(), nombre: estudio, modalidad: modalidadNueva, categoria:"GENERAL", activo:true, usos:0 };
        CATALOGO.push(entradaCatalogo);
        if(!CATEGORIAS.find(c=> c.nombre===modalidadNueva)){ CATEGORIAS.push({ nombre:modalidadNueva, activo:true }); categoriaNuevaRegistrada = true; }
      }
      // Copia de los campos del estudio ANTES de tocarlos, para poder deshacer si falla el guardado.
      const estadoAnteriorEntradaCatalogo = { activo: entradaCatalogo.activo, usos: entradaCatalogo.usos };
      if(!esEntradaCatalogoNueva && !entradaCatalogo.activo){ entradaCatalogo.activo = true; }
      if(!casoExistente || casoExistente.estudio !== estudio){
        entradaCatalogo.usos = (entradaCatalogo.usos||0) + 1;
      }
      let areaEsNueva = false;
      const copiaAreasAnterior = AREAS.slice();
      if(!AREAS.find(a=> normKey(a)===normKey(area))){ AREAS.push(area); areaEsNueva = true; }

      let casoGuardado, esNuevo, copiaCasoExistenteAntes = null;
      const selectPropietario = document.getElementById("nc-propietario");
      if(casoExistente){
        copiaCasoExistenteAntes = { ...casoExistente };
        delete casoExistente.paciente; // purga cualquier valor heredado de antes de este cambio
        casoExistente.hcl = hcl;
        casoExistente.orden = orden;
        casoExistente.estudio = estudio;
        casoExistente.area = area;
        casoExistente.diagnostico = diagnostico;
        casoExistente.fechaIngreso = fechaIngreso;
        // Reasignar propietario: SOLO existe este control si es administrador (ver el HTML del modal).
        if(selectPropietario && esAdministrador() && selectPropietario.value !== casoExistente.creadoPorId){
          const nuevoPropietario = USUARIOS.find(u=> u.id===selectPropietario.value);
          if(nuevoPropietario){
            casoExistente.creadoPorId = nuevoPropietario.id;
            casoExistente.aportadoPor = nuevoPropietario.nombres + " " + nuevoPropietario.apellidos;
            casoExistente.rol = nuevoPropietario.rol;
          }
        }
        casoGuardado = casoExistente;
        esNuevo = false;
      } else {
        // El número de caso se pide a Firestore con una transacción atómica: si dos equipos
        // guardan un caso nuevo al mismo tiempo, cada uno recibe un número distinto sin choques.
        btnGuardar.disabled = true;
        let numero;
        try{
          numero = await generarNumeroCasoAtomico();
        }catch(err){
          console.error("Error al generar el número de caso:", err);
          btnGuardar.disabled = false;
          toast("NO SE PUDO CONTACTAR EL SERVIDOR. INTENTA DE NUEVO.");
          return;
        }
        casoGuardado = {
          id: pad6(numero), hospital: HOSPITAL,
          hcl, orden, estudio, area, diagnostico,
          aportadoPor: nombreCompletoPerfil(), rol: PERFIL.rol, creadoPorId: PERFIL.id,
          fechaIngreso: fechaIngreso
        };
        CASOS.push(casoGuardado);
        esNuevo = true;
      }

      // ---- 2) Confirmación y actualización de pantalla INMEDIATAS, sin esperar la red ----
      back.remove();
      toast(esNuevo ? ("CASO #" + casoGuardado.id + " GUARDADO CORRECTAMENTE") : ("CASO #" + casoGuardado.id + " ACTUALIZADO"));
      if(esNuevo){ TAB = "biblioteca"; }
      renderMain();

      // ---- 3) Persistencia real en Firestore, en paralelo, sin bloquear la interfaz ----
      // Cada caso y cada estudio se guarda como SU PROPIO documento (no se reescribe la
      // colección completa), para no pisar los cambios que otro equipo esté guardando al
      // mismo tiempo sobre otros registros distintos.
      (async ()=>{
        try{
          const escrituras = [ guardarRegistro("casos", casoGuardado), guardarRegistro("catalogo_estudios", entradaCatalogo) ];
          if(categoriaNuevaRegistrada) escrituras.push(guardarCategorias(CATEGORIAS));
          if(areaEsNueva) escrituras.push(guardarAreas(AREAS));
          await Promise.all(escrituras);
        }catch(err){
          console.error("Error al guardar el caso en Firestore:", err);
          if(esEntradaCatalogoNueva){ CATALOGO = CATALOGO.filter(e=> e.id!==entradaCatalogo.id); }
          else{ Object.assign(entradaCatalogo, estadoAnteriorEntradaCatalogo); }
          CATEGORIAS = copiaCategoriasAnterior;
          AREAS = copiaAreasAnterior;
          if(esNuevo){ CASOS = CASOS.filter(c=> c.id!==casoGuardado.id); }
          else if(copiaCasoExistenteAntes){ Object.assign(casoExistente, copiaCasoExistenteAntes); }
          toast("NO SE PUDO GUARDAR EL CASO EN EL SERVIDOR. SE DESHIZO EL CAMBIO — INTÉNTALO DE NUEVO.");
          renderMain();
        }
      })();
    });
  }

  init();
})();
</script>
</body>
</html>
