<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Casos Radiológicos — IESS San Francisco</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg: #F4F6F7;
    --surface: #FFFFFF;
    --ink: #17262F;
    --ink-soft: #55697A;
    --ink-faint: #8A9AA6;
    --border: #DCE4E8;
    --accent: #0E7490;
    --accent-dark: #0B5D74;
    --accent-tint: #E4F1F4;
    --seguro: #2F9E52;
    --seguro-tint: #E6F5EA;
    --proximo: #B9860A;
    --proximo-tint: #FBF2DD;
    --prioridad: #C15A22;
    --prioridad-tint: #FBE9DD;
    --urgente: #B23A3A;
    --urgente-tint: #FAE4E4;
    --vencido: #5C3B63;
    --vencido-tint: #EEE4EF;
    --radius: 3px;
    --shadow: 0 1px 2px rgba(23,38,47,0.06);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.01em; }
  a{ color: inherit; }
  button{ font-family: inherit; cursor:pointer; }
  input, select, textarea{ font-family: inherit; font-size: 14px; }

  /* ---------- App shell ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  header.topbar{
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap: wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand h1{ margin:0; font-size:19px; font-weight:800; color: var(--ink); letter-spacing: -0.01em; }
  .brand .hospital{ font-size:12.5px; color: var(--accent-dark); font-weight:600; }
  .userbox{ display:flex; align-items:center; gap:12px; }
  .userchip{
    display:flex; flex-direction:column; align-items:flex-end; line-height:1.25;
  }
  .userchip .name{ font-weight:700; font-size:13.5px; }
  .userchip .role{ font-size:11.5px; color: var(--ink-soft); }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background: var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; flex-shrink:0;
  }
  .linkbtn{
    background:none; border:none; color: var(--accent-dark); font-size:12.5px; font-weight:600;
    padding:2px 0; text-decoration: underline; text-underline-offset: 2px;
  }

  nav.tabs{
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display:flex; gap: 4px;
    overflow-x:auto;
  }
  nav.tabs button{
    background:none; border:none; padding: 13px 16px;
    font-size: 13.5px; font-weight:600; color: var(--ink-soft);
    border-bottom: 2px solid transparent; white-space:nowrap;
  }
  nav.tabs button.active{ color: var(--accent-dark); border-bottom-color: var(--accent); }
  nav.tabs button .badge{
    display:inline-block; margin-left:6px; background: var(--urgente); color:#fff;
    font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:10px;
  }

  main{ flex:1; max-width: 1180px; width:100%; margin: 0 auto; padding: 26px 28px 60px; }

  .panel-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .panel-head h2{ margin:0 0 4px; font-size: 20px; font-weight:800; }
  .panel-head p{ margin:0; color: var(--ink-soft); font-size:13px; }

  .btn-primary{
    background: var(--accent); color:#fff; border:none; padding: 11px 18px;
    border-radius: var(--radius); font-weight:700; font-size:13.5px;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary:hover{ background: var(--accent-dark); }
  .btn-secondary{
    background: var(--surface); color: var(--ink); border:1px solid var(--border); padding: 10px 16px;
    border-radius: var(--radius); font-weight:600; font-size:13.5px;
  }
  .btn-secondary:hover{ border-color: var(--accent); color: var(--accent-dark); }
  .btn-danger{ background:none; border:1px solid var(--urgente); color: var(--urgente); padding:6px 10px; border-radius:var(--radius); font-size:12px; font-weight:600; }

  /* ---------- Filters ---------- */
  .filterbar{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding: 12px;
  }
  .filterbar input[type=text], .filterbar select{
    border:1px solid var(--border); border-radius: var(--radius); padding: 9px 10px; background: var(--bg);
  }
  .filterbar input[type=text]{ flex: 1 1 220px; min-width:180px; }
  .filterbar select{ flex: 0 1 190px; }

  /* ---------- Summary chips ---------- */
  .summary-row{ display:flex; gap:10px; margin-bottom: 18px; flex-wrap:wrap; }
  .chip{
    flex:1 1 150px; border-radius: var(--radius); padding: 12px 14px; border:1px solid var(--border);
    background: var(--surface); border-left: 4px solid var(--ink-faint);
  }
  .chip .n{ font-size:22px; font-weight:800; font-family:'IBM Plex Mono', monospace; }
  .chip .l{ font-size:11.5px; color: var(--ink-soft); font-weight:600; text-transform: uppercase; letter-spacing: 0.03em; }
  .chip.urgente{ border-left-color: var(--urgente); }
  .chip.prioridad{ border-left-color: var(--prioridad); }
  .chip.proximo{ border-left-color: var(--proximo); }
  .chip.total{ border-left-color: var(--accent); }

  /* ---------- Table ---------- */
  .tablewrap{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  table{ width:100%; border-collapse: collapse; }
  thead th{
    text-align:left; font-size: 11px; text-transform:uppercase; letter-spacing:0.04em;
    color: var(--ink-soft); font-weight:700; padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: #FAFBFC;
  }
  tbody td{ padding: 12px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ border-left: 4px solid transparent; }
  tbody tr.seguro{ border-left-color: var(--seguro); }
  tbody tr.proximo{ border-left-color: var(--proximo); }
  tbody tr.prioridad{ border-left-color: var(--prioridad); }
  tbody tr.urgente{ border-left-color: var(--urgente); }
  tbody tr.vencido{ border-left-color: var(--vencido); }
  .caseid{ font-weight:700; }
  tbody tr.reciente{ background: var(--accent-tint); }
  .badge-nuevo{
    display:inline-block; margin-left:7px; background: var(--accent); color:#fff;
    font-size:9.5px; font-weight:800; letter-spacing:0.03em; padding:1.5px 6px; border-radius:8px;
    vertical-align:middle;
    animation: parpadeoNuevo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeoNuevo{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @media (prefers-reduced-motion: reduce){
    .badge-nuevo{ animation: none; }
  }
  .aportadopor{ font-size:12.5px; color: var(--accent-dark); font-weight:700; }
  .rolechip{ font-size:10.5px; color: var(--ink-soft); font-weight:600; }
  .diag{ max-width: 230px; }

  .badge-estado{
    display:inline-flex; align-items:center; gap:6px; padding: 4px 9px; border-radius: 20px;
    font-size: 11px; font-weight:700; letter-spacing:0.02em; white-space:nowrap;
  }
  .badge-estado::before{ content:''; width:7px; height:7px; border-radius:50%; }
  .badge-estado.seguro{ background: var(--seguro-tint); color: #1F6E38; }
  .badge-estado.seguro::before{ background: var(--seguro); }
  .badge-estado.proximo{ background: var(--proximo-tint); color: #8A6607; }
  .badge-estado.proximo::before{ background: var(--proximo); }
  .badge-estado.prioridad{ background: var(--prioridad-tint); color: #92431A; }
  .badge-estado.prioridad::before{ background: var(--prioridad); }
  .badge-estado.urgente{ background: var(--urgente-tint); color: #8C2C2C; }
  .badge-estado.urgente::before{ background: var(--urgente); }
  .badge-estado.vencido{ background: var(--vencido-tint); color: #452B4A; }
  .badge-estado.vencido::before{ background: var(--vencido); }

  .tiemporestante{ font-size:12px; color: var(--ink-soft); margin-top:3px; }
  .alerta-texto{ font-size:11.5px; margin-top:4px; font-weight:600; }
  .alerta-texto.prioridad{ color: var(--prioridad); }
  .alerta-texto.urgente{ color: var(--urgente); }
  .alerta-texto.vencido{ color: var(--vencido); }

  .empty{ padding: 60px 20px; text-align:center; color: var(--ink-soft); }
  .empty h3{ color: var(--ink); margin-bottom:6px; }

  /* ---------- Forms / Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(23,38,47,0.45); display:flex; align-items:flex-start; justify-content:center;
    padding: 40px 16px; overflow-y:auto; z-index: 50;
  }
  .modal{
    background: var(--surface); border-radius: 6px; width: 100%; max-width: 640px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-header{ padding: 20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .modal-header h3{ margin:0; font-size:17px; font-weight:800; }
  .modal-close{ background:none; border:none; font-size:20px; color: var(--ink-soft); line-height:1; }
  .modal-body{ padding: 22px 24px; }
  .modal-footer{ padding: 16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }

  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size: 12.5px; font-weight:700; color: var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.02em; }
  .field input[type=text], .field textarea, .field select{
    width:100%; border:1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--bg);
  }
  .field textarea{ min-height: 76px; resize: vertical; }
  .field .hint{ font-size:11.5px; color: var(--ink-faint); margin-top:4px; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline: 2px solid var(--accent); outline-offset:1px; background:#fff; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .readonly-row{ display:flex; gap:18px; flex-wrap:wrap; background: var(--accent-tint); border-radius: var(--radius); padding: 12px 14px; margin-bottom:18px; }
  .readonly-row .ro{ font-size:12.5px; }
  .readonly-row .ro b{ display:block; font-size:11px; color: var(--accent-dark); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:2px; }

  .combo{ position:relative; }
  .combo-list{
    position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-height: 260px; overflow-y:auto; z-index: 10;
  }
  .combo-group{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color: var(--ink-faint); padding:8px 12px 4px; font-weight:700; }
  .combo-item{ padding: 9px 12px; font-size:13.5px; cursor:pointer; }
  .combo-item:hover, .combo-item.hl{ background: var(--accent-tint); }
  .combo-create{ padding: 10px 12px; font-size:13px; color: var(--accent-dark); font-weight:700; border-top:1px solid var(--border); cursor:pointer; }
  .combo-create:hover{ background: var(--accent-tint); }

  /* ---------- Onboarding ---------- */
  .onboard-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background: var(--bg); }
  .onboard-card{ background:#fff; border:1px solid var(--border); border-radius:6px; max-width: 440px; width:100%; padding: 34px 30px; box-shadow: var(--shadow); }
  .onboard-card h1{ font-size:19px; margin: 0 0 2px; font-weight:800; }
  .onboard-card .sub{ color: var(--ink-soft); font-size:13px; margin-bottom: 22px; }
  .segmented{ display:flex; border:1px solid var(--border); border-radius: var(--radius); overflow:hidden; }
  .segmented button{ flex:1; padding:9px 6px; background:#fff; border:none; font-size:12.5px; font-weight:700; color: var(--ink-soft); border-right:1px solid var(--border); }
  .segmented button:last-child{ border-right:none; }
  .segmented button.sel{ background: var(--accent); color:#fff; }

  .toast{
    position: fixed; bottom: 22px; left:50%; transform: translateX(-50%);
    background: var(--ink); color:#fff; padding: 11px 20px; border-radius: 6px; font-size:13px; font-weight:600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 100;
  }

  @media (max-width: 760px){
    main{ padding: 18px 14px 50px; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tbody tr{ border:1px solid var(--border); border-left-width:4px; border-radius: var(--radius); margin-bottom:10px; padding:4px 0; }
    tbody td{ border-bottom:none; padding: 5px 12px; }
    tbody td[data-label]::before{ content: attr(data-label); display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color: var(--ink-faint); font-weight:700; margin-bottom:2px; }
    .row2{ grid-template-columns: 1fr; }
    .tablewrap{ border:none; background:none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase (Firestore = base de datos compartida real; Auth anónimo = requerido por las
     reglas de seguridad recomendadas, ver README-FIREBASE.md). Se cargan por CDN porque este
     proyecto es un solo archivo estático, sin paso de compilación ni npm install. -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
(function(){
  "use strict";

  /* ============================= UTILIDADES ============================= */

  /* ============================= FIREBASE / FIRESTORE ============================= */
  // Cloud Firestore es la base de datos principal y compartida de verdad. localStorage
  // solo se usa para una cosa puramente local a este dispositivo (qué usuario quedó
  // recordado en ESTE navegador) — nunca para casos, catálogo, usuarios ni nada que
  // deba verse igual en todos los equipos.
  const firebaseConfig = {
    apiKey: "AIzaSyAFJXoRkbhf2-kBl9iOZEvH2r-saqXVj1w",
    authDomain: "banco-de-casos.firebaseapp.com",
    projectId: "banco-de-casos",
    storageBucket: "banco-de-casos.firebasestorage.app",
    messagingSenderId: "352457852749",
    appId: "1:352457852749:web:366f874e6c7e3a39735904",
    measurementId: "G-QM8J7DDZ8H"
  };
  if(typeof firebase === "undefined"){
    document.getElementById("app").innerHTML =
      '<div class="empty"><h3>No se pudo cargar Firebase</h3>' +
      '<p>Revisa tu conexión a internet y recarga la página. Si el problema sigue, ' +
      'puede que un bloqueador de anuncios o el firewall de la red estén bloqueando ' +
      'www.gstatic.com — necesario para conectar con la base de datos.</p></div>';
    throw new Error("El SDK de Firebase no se cargó (revisa la conexión a internet / bloqueadores).");
  }
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Caché local OPCIONAL (IndexedDB, gestionada por el propio Firestore): permite que la
  // app siga mostrando los últimos datos vistos si hay un corte de red momentáneo. Firestore
  // en la nube sigue siendo la única fuente de verdad — esto nunca la sustituye.
  db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
    console.warn("Caché local de Firestore no disponible (normal con varias pestañas abiertas):", err.code);
  });

  // Las reglas de seguridad recomendadas (ver README-FIREBASE.md) exigen estar autenticado,
  // aunque sea de forma anónima, para poder leer o escribir. Esto es independiente del
  // selector de usuario propio de la app — solo autentica el NAVEGADOR ante Firebase.
  const listoParaFirestore = firebase.auth().signInAnonymously()
    .catch(err=> console.error("No se pudo autenticar de forma anónima con Firebase:", err));
  async function esperarAutenticacion(){ try{ await listoParaFirestore; }catch(e){} }

  // ---- Colecciones con UN documento por registro real (casos, catálogo de estudios, usuarios) ----
  // Cada caso, cada estudio y cada usuario es su propio documento. Así, si dos personas crean,
  // editan o eliminan registros distintos al mismo tiempo, no se pisan entre sí (a diferencia de
  // guardar todo en un solo documento gigante).
  //
  // IMPORTANTE — esto es justamente lo que corrige el problema de "usuarios que desaparecen":
  // la carga INICIAL se hace con una lectura explícita (get), pidiendo primero el dato real del
  // SERVIDOR y solo cayendo a la caché local si de verdad no hay red. Antes, la carga inicial se
  // resolvía con el primer aviso de onSnapshot(), y ese primer aviso muchas veces viene de la
  // caché local ANTES de que el servidor responda; si la caché todavía no tenía sincronizado el
  // documento (otro dispositivo, caché recién borrada, reconexión de red, etc.), parecía que "no
  // había usuarios todavía" y el código sembraba de nuevo solo el administrador, borrando a los
  // demás — y esa sobrescritura se sincronizaba al instante a todo el mundo. Con get() esto ya
  // no puede pasar: la app espera una respuesta real antes de decidir si algo existe o no.
  // onSnapshot() se sigue usando, pero ÚNICAMENTE para recibir actualizaciones DESPUÉS de esa
  // primera lectura confiable — nunca para decidir si hay que sembrar datos.
  async function cargarColeccionInicial(nombreColeccion){
    await esperarAutenticacion();
    try{
      const snap = await db.collection(nombreColeccion).get({ source: "server" });
      return snap.docs.map(d=> d.data());
    }catch(err){
      console.warn("No se pudo leer '"+nombreColeccion+"' del servidor (¿sin conexión?), usando caché local:", err.code||err.message);
      const snap = await db.collection(nombreColeccion).get({ source: "cache" });
      return snap.docs.map(d=> d.data());
    }
  }
  function suscribirColeccionCambios(nombreColeccion, alActualizar){
    db.collection(nombreColeccion).onSnapshot(
      snap=> alActualizar(snap.docs.map(d=> d.data())),
      err=> console.error("Error de sincronización en tiempo real ("+nombreColeccion+"):", err)
    );
  }
  async function guardarRegistro(nombreColeccion, registro){
    await esperarAutenticacion();
    await db.collection(nombreColeccion).doc(String(registro.id)).set(registro);
  }
  async function eliminarRegistro(nombreColeccion, id){
    await esperarAutenticacion();
    await db.collection(nombreColeccion).doc(String(id)).delete();
  }
  async function guardarRegistrosEnLote(nombreColeccion, registros){
    await esperarAutenticacion();
    for(let i=0; i<registros.length; i+=450){ // límite real de Firestore: 500 operaciones por lote
      const grupo = registros.slice(i, i+450);
      const lote = db.batch();
      grupo.forEach(r=> lote.set(db.collection(nombreColeccion).doc(String(r.id)), r));
      await lote.commit();
    }
  }

  // ---- Documentos de configuración (categorías, áreas): cambian poco y los administra una
  // sola persona a la vez, así que un documento único por tipo alcanza. Misma corrección que
  // arriba: lectura inicial confiable contra el servidor, separada del listener en vivo. ----
  async function cargarDocumentoInicial(nombreColeccion, idDocumento){
    await esperarAutenticacion();
    try{
      const snap = await db.collection(nombreColeccion).doc(idDocumento).get({ source: "server" });
      return snap.exists ? snap.data().valor : null;
    }catch(err){
      console.warn("No se pudo leer '"+nombreColeccion+"/"+idDocumento+"' del servidor, usando caché local:", err.code||err.message);
      const snap = await db.collection(nombreColeccion).doc(idDocumento).get({ source: "cache" });
      return snap.exists ? snap.data().valor : null;
    }
  }
  function suscribirDocumentoCambios(nombreColeccion, idDocumento, alActualizar){
    db.collection(nombreColeccion).doc(idDocumento).onSnapshot(
      snap=>{ if(snap.exists) alActualizar(snap.data().valor); },
      err=> console.error("Error de sincronización en tiempo real ("+nombreColeccion+"/"+idDocumento+"):", err)
    );
  }
  async function guardarDocumento(nombreColeccion, idDocumento, valor){
    await esperarAutenticacion();
    await db.collection(nombreColeccion).doc(idDocumento).set({ valor });
  }

  // Contador atómico para el número de caso: usa una transacción de Firestore para que dos
  // equipos guardando un caso nuevo al mismo tiempo NUNCA reciban el mismo número.
  async function generarNumeroCasoAtomico(){
    await esperarAutenticacion();
    const ref = db.collection("configuracion").doc("contador_casos");
    return db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const siguiente = (snap.exists ? (snap.data().valor||0) : 0) + 1;
      tx.set(ref, { valor: siguiente });
      return siguiente;
    });
  }

  const HOSPITAL = "IESS SAN FRANCISCO";



  // Cada estudio tiene MODALIDAD (el tipo de equipo: TC, RX, ECO, RM) y CATEGORÍA (la región
  // del cuerpo, solo para organizar la vista dentro de una modalidad). Son dos campos
  // distintos y ambos se pueden editar desde el catálogo.
  const MODALIDADES = ["TOMOGRAFÍA", "RADIOGRAFÍA", "ECOGRAFÍA", "RESONANCIA MAGNÉTICA"];
  const CATEGORIAS_INICIALES = MODALIDADES.slice();

  // Catálogo precargado: [nombre oficial, modalidad, categoría/región].

  // Inferencia automática de MODALIDAD a partir del nombre, para que crear un estudio
  // nuevo no obligue a elegir manualmente el tipo (aunque siempre se puede corregir).
  function inferirCategoria(nombreEstudio){
    const n = normKey(nombreEstudio);
    if(/\bRM\b|RESONANCIA/.test(n)) return "RESONANCIA MAGNÉTICA";
    if(/\bECO\b|ECOGRAFIA|ULTRASONIDO|DOPPLER/.test(n)) return "ECOGRAFÍA";
    if(/\bRX\b|RADIOGRAFIA|RAYOS X/.test(n)) return "RADIOGRAFÍA";
    if(/\bTC\b|\bTAC\b|TOMOGRAFIA|ANGIO ?TC|URO ?TC|ENTERO ?TC|BODY TC/.test(n)) return "TOMOGRAFÍA";
    return null;
  }

  const AREAS_INICIAL = [

  function up(s){ return (s||"").toString().toLocaleUpperCase("es-ES").replace(/\s+/g," ").trim(); }
  // Versión para usar MIENTRAS el usuario escribe: sube a mayúsculas y colapsa espacios dobles,
  // pero NUNCA recorta un espacio al final/inicio — de lo contrario, el espacio que el usuario
  // acaba de teclear entre dos palabras desaparece antes de poder escribir la siguiente palabra
  // (bug real: "NEURORRADIOLOGIA" + [espacio] se recortaba a "NEURORRADIOLOGIA" y al seguir
  // escribiendo quedaba "NEURORRADIOLOGIAPEDIATRICA"). La normalización estricta (con trim)
  // se sigue aplicando en up() al momento de guardar.
  function upLive(s){ return (s||"").toString().toLocaleUpperCase("es-ES").replace(/ {2,}/g," "); }
  function normKey(s){ return up(s).normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

  /* --- Normalización y equivalencias de tipos de estudio --- */
  const STOPWORDS_ESTUDIO = new Set(["DE","Y","CON","SIN","DEL","LA","EL","LOS","LAS","A","EN"]);
  const EQUIVALENCIAS_ESTUDIO = [
    [/TOMOGRAFIA COMPUTARIZADA/g, "TC"],
    [/TOMOGRAFICO/g, "TC"],
    [/TOMOGRAFIA/g, "TC"],
    [/\bTAC\b/g, "TC"],
    [/RESONANCIA MAGNETICA/g, "RM"],
    [/\bRESONANCIA\b/g, "RM"],
    [/\bULTRASONIDO\b/g, "ECOGRAFIA"],
    [/\bECO\b/g, "ECOGRAFIA"],
    [/RAYOS X/g, "RADIOGRAFIA"],
    [/\bRX\b/g, "RADIOGRAFIA"],
    [/CON CONTRASTE/g, "CONTRASTADA"],
    [/SIN CONTRASTE/g, "SIMPLE"],

    [/ABDOMINOPELVICA/g, "ABDOMEN PELVIS"],
    [/\bUROTAC\b/g, "URO TC"],
    [/\bUROLOGICA\b/g, "URO"],
    [/\bCEREBRAL\b/g, "CRANEO"],
    [/\bCEREBRO\b/g, "CRANEO"],
    [/\bTEP\b/g, "ARTERIAS PULMONARES"]

  function tokensEstudio(nombre){
    let s = normKey(nombre).replace(/-/g, " ");
    EQUIVALENCIAS_ESTUDIO.forEach(([re, rep])=> { s = s.replace(re, rep); });
    s = s.replace(/\s+/g, " ").trim();
    const tokens = s.split(" ").filter(t=> t && !STOPWORDS_ESTUDIO.has(t));
    return Array.from(new Set(tokens));
  }
  function claveCanonicaEstudio(nombre){
    return tokensEstudio(nombre).slice().sort().join(" ");
  }
  // Cachea la clave canónica y los tokens EN el propio objeto del catálogo (se calculan
  // regex/normalización pesada una sola vez por estudio, no en cada tecla que escribe el
  // usuario al buscar). invalidarCacheEstudio() se llama cada vez que se renombra un estudio.
  function claveCanonicaDeEntrada(entry){
    if(entry._clave === undefined) entry._clave = claveCanonicaEstudio(entry.nombre);
    return entry._clave;
  }
  function invalidarCacheEstudio(entry){
    delete entry._clave;
    delete entry._tokens;
  }
  function buscarEstudioDuplicado(nombre, lista){
    const clave = claveCanonicaEstudio(nombre);
    if(!clave) return null;
    return lista.find(e=> claveCanonicaDeEntrada(e) === clave) || null;
  }

  // Corrige duplicados YA EXISTENTES en el catálogo (por ejemplo, "UROTAC SIMPLE" repetido
  // varias veces con distinto id). Agrupa por clave canónica; de cada grupo conserva un solo
  // registro (el de más uso real, para no perder historial), normaliza su nombre a MAYÚSCULAS,
  // suma los usos de todos los duplicados, reasigna los casos que apuntaban a cualquiera de los
  // nombres del grupo hacia el nombre normalizado, y solo entonces elimina los sobrantes.
  // Es segura de ejecutar en cada carga: si el catálogo ya está limpio, no escribe nada.
  async function limpiarDuplicadosCatalogo(){
    const grupos = new Map();
    CATALOGO.forEach(e=>{
      const clave = claveCanonicaEstudio(e.nombre);
      if(!clave) return;
      if(!grupos.has(clave)) grupos.set(clave, []);
      grupos.get(clave).push(e);
    });

    const entradasAActualizar = [];
    const idsAEliminar = [];
    const casosAActualizar = [];

    grupos.forEach(grupo=>{
      const nombreNormalizado = up(grupo[0].nombre);
      if(grupo.length === 1){
        if(grupo[0].nombre !== nombreNormalizado){
          grupo[0].nombre = nombreNormalizado;
          invalidarCacheEstudio(grupo[0]);
          entradasAActualizar.push(grupo[0]);
        }
        return;
      }
      // Hay más de un registro para el mismo estudio real: se conserva el de más uso.
      grupo.sort((a,b)=> (b.usos||0) - (a.usos||0));
      const principal = grupo[0];
      const sobrantes = grupo.slice(1);
      const usosTotal = grupo.reduce((suma,e)=> suma + (e.usos||0), 0);

      principal.nombre = nombreNormalizado;
      principal.usos = usosTotal;
      invalidarCacheEstudio(principal);
      entradasAActualizar.push(principal);

      const nombresDelGrupo = new Set(grupo.map(e=> e.nombre));
      CASOS.forEach(c=>{
        if(nombresDelGrupo.has(c.estudio) && c.estudio !== nombreNormalizado){
          c.estudio = nombreNormalizado;
          casosAActualizar.push(c);
        }
      });
      sobrantes.forEach(e=> idsAEliminar.push(e.id));
    });

    if(entradasAActualizar.length===0 && idsAEliminar.length===0 && casosAActualizar.length===0) return;

    try{
      if(entradasAActualizar.length) await guardarRegistrosEnLote("catalogo_estudios", entradasAActualizar);
      if(casosAActualizar.length) await guardarRegistrosEnLote("casos", casosAActualizar);
      for(const id of idsAEliminar){ await eliminarRegistro("catalogo_estudios", id); }
      if(idsAEliminar.length){
        const idsSet = new Set(idsAEliminar);
        CATALOGO = CATALOGO.filter(e=> !idsSet.has(e.id));
      }
      console.warn("Catálogo de estudios: se corrigieron duplicados —", idsAEliminar.length, "registro(s) sobrante(s) eliminado(s),", entradasAActualizar.length, "normalizado(s) a MAYÚSCULAS.");
    }catch(err){
      console.error("Error al limpiar duplicados del catálogo (se reintentará en la próxima carga):", err);
    }
  }

  function coincideEstudio(entry, consulta){
    const qTokens = tokensEstudio(consulta);
    if(qTokens.length===0) return true;
    if(!entry._tokens) entry._tokens = tokensEstudio(entry.nombre);
    return qTokens.every(qt=> entry._tokens.some(et=> et.startsWith(qt) || qt.startsWith(et)));
  }
  function modalidadActiva(nombreModalidad){
    const c = CATEGORIAS.find(x=> x.nombre === nombreModalidad);
    return c ? c.activo : true; // si no está registrada (dato legado), se asume activa
  }
  function estudiosDisponibles(){
    return CATALOGO.filter(e=> e.activo && modalidadActiva(e.modalidad));
  }
  // "FRECUENTES": estudios de acceso rápido al inicio del buscador. Prioriza el uso real
  // registrado (campo `usos`, que se incrementa cada vez que se elige el estudio al crear un
  // caso); completa con la lista curada inicial mientras no haya suficiente historial real.
  function estudiosFrecuentes(limite){
    limite = limite || 8;
    const disponibles = estudiosDisponibles();
    const porUso = disponibles.filter(e=> e.usos > 0).sort((a,b)=> b.usos - a.usos);
    const resultado = porUso.slice(0, limite);
    if(resultado.length < limite){
      const nombresYaIncluidos = new Set(resultado.map(e=> e.nombre));
      for(const nombre of FRECUENTES_INICIALES){
        if(resultado.length >= limite) break;
        if(nombresYaIncluidos.has(nombre)) continue;
        const entrada = disponibles.find(e=> e.nombre===nombre);
        if(entrada){ resultado.push(entrada); nombresYaIncluidos.add(nombre); }
      }
    }
    return resultado;
  }
  function pad6(n){ return String(n).padStart(6,"0"); }
  // CORRECCIÓN DE FECHA: un campo "YYYY-MM-DD" es SOLO fecha, sin hora ni zona horaria.
  // `new Date("YYYY-MM-DD")` lo interpreta como medianoche UTC; al leer luego con getDate()/
  // getMonth()/getFullYear() (que son en hora LOCAL) el día retrocede uno en cualquier zona con
  // offset negativo (p. ej. Ecuador, UTC-5). parseISO() construye la fecha directamente en
  // hora LOCAL, sin pasar nunca por UTC, y es la única forma correcta de leer estos campos.
  function parseISO(iso){
    if(!iso) return new Date(NaN);
    const partes = String(iso).split("-");
    const y = Number(partes[0]), m = Number(partes[1]), d = Number(partes[2]);
    return new Date(y, (m||1)-1, d||1);
  }
  function fmtDate(d){
    if(!d) return "—";
    // Formateo directo por texto: evita por completo crear un objeto Date para mostrar el
    // valor, que es la forma más segura de no introducir ningún desfase de zona horaria.
    const partes = String(d).split("-");
    if(partes.length!==3) return String(d);
    const [y,m,day] = partes;
    return day.padStart(2,"0")+"/"+m.padStart(2,"0")+"/"+y;
  }
  function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function addYears(iso, years){ const d = parseISO(iso); d.setFullYear(d.getFullYear()+years); return d; }

  function diffYMD(from, to){
    // devuelve diferencia calendario positiva entre from y to (to >= from)
    let start = new Date(from), end = new Date(to);
    let years = end.getFullYear() - start.getFullYear();
    let months = end.getMonth() - start.getMonth();
    let days = end.getDate() - start.getDate();
    if(days < 0){
      months -= 1;
      const prevMonth = new Date(end.getFullYear(), end.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if(months < 0){ years += -1; months += 12; }
    return {years, months, days};
  }

  function estadoConservacion(fechaIngresoISO){
    const hoy = new Date();
    const objetivo = addYears(fechaIngresoISO, 2);
    const diffDays = Math.floor((objetivo - hoy) / 86400000);
    let estado, mensaje1, mensaje2 = "";
    if(diffDays < 0){
      estado = "vencido"; mensaje1 = "ESTUDIO CON ANTIGÜEDAD ≥ 2 AÑOS";
    } else if(diffDays < 30){
      estado = "urgente"; mensaje1 = "DESCARGA URGENTE"; mensaje2 = "EL ESTUDIO PUEDE ESTAR PRÓXIMO A ELIMINARSE DEL SISTEMA INSTITUCIONAL.";
    } else if(diffDays < 90){
      estado = "prioridad"; mensaje1 = "RESPALDAR ESTUDIO"; mensaje2 = "ESTE CASO ESTÁ PRÓXIMO A CUMPLIR 2 AÑOS. SE RECOMIENDA DESCARGAR EL ESTUDIO ORIGINAL DEL PACS.";
    } else if(diffDays < 180){
      estado = "proximo"; mensaje1 = "PRÓXIMO A FECHA DE RESPALDO";
    } else {
      estado = "seguro"; mensaje1 = "ESTUDIO DENTRO DEL PERÍODO DE CONSERVACIÓN";
    }
    let restante;
    if(diffDays < 0){
      const v = diffYMD(objetivo, hoy);
      restante = "VENCIDO HACE " + fmtYMD(v);
    } else {
      const v = diffYMD(hoy, objetivo);
      restante = fmtYMD(v) + " RESTANTES";
    }
    return { estado, mensaje1, mensaje2, objetivo, diffDays, restante };
  }
  function fmtYMD(v){
    const parts = [];
    if(v.years > 0) parts.push(v.years + (v.years===1?" AÑO":" AÑOS"));
    if(v.months > 0) parts.push(v.months + (v.months===1?" MES":" MESES"));
    if(v.days > 0 || parts.length===0) parts.push(v.days + (v.days===1?" DÍA":" DÍAS"));
    if(parts.length === 1) return parts[0];
    if(parts.length === 2) return parts[0] + " Y " + parts[1];
    return parts[0] + ", " + parts[1] + " Y " + parts[2];
  }

  const ESTADO_LABEL = { seguro:"SEGURO", proximo:"PRÓXIMO A RESPALDAR", prioridad:"PRIORIDAD DE DESCARGA", urgente:"URGENTE", vencido:"CUMPLIÓ DOS AÑOS" };
  const ORDEN_ESTADO = { urgente:0, vencido:1, prioridad:2, proximo:3, seguro:4 };

  function toast(msg){
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2600);
  }

  function debounce(fn, ms){
    let timer = null;
    return function(...args){
      clearTimeout(timer);
      timer = setTimeout(()=> fn.apply(this, args), ms);
    };
  }

  // Diálogo de confirmación propio de la app. El confirm() nativo del navegador queda
  // bloqueado dentro de iframes en sandbox (como el que usa este entorno para mostrar la
  // app) y falla en silencio: el botón parece "no hacer nada". Este modal reemplaza a
  // confirm() por completo y no depende de ningún permiso especial del navegador.
  function confirmarAccion(mensaje){
    return new Promise(resolve=>{
      const back = document.createElement("div");
      back.className = "modal-backdrop";
      back.innerHTML = `
        <div class="modal" style="max-width:380px;">
          <div class="modal-body" style="padding-top:26px; padding-bottom:6px; font-size:14.5px; font-weight:600; white-space:pre-line;">${mensaje}</div>
          <div class="modal-footer">
            <button class="btn-secondary" id="conf-cancelar">Cancelar</button>
            <button class="btn-primary" id="conf-aceptar" style="background:var(--urgente);">Eliminar</button>
          </div>
        </div>`;
      document.body.appendChild(back);
      function cerrar(valor){ back.remove(); resolve(valor); }
      document.getElementById("conf-cancelar").addEventListener("click", ()=> cerrar(false));
      document.getElementById("conf-aceptar").addEventListener("click", ()=> cerrar(true));
      back.addEventListener("click", (e)=>{ if(e.target===back) cerrar(false); });
    });
  }

  function uppercaseInputs(root){
    root.querySelectorAll("[data-upper]").forEach(el=>{
      el.addEventListener("input", ()=>{
        const pos = el.selectionStart;
        el.value = upLive(el.value);
        if(pos!=null) el.setSelectionRange(pos,pos);
      });
    });
  }

  /* ============================= ESTADO / STORAGE ============================= */
  let PERFIL = null;
  let USUARIOS = []; // [{id, nombres, apellidos, rol, activo}]
  let CATALOGO = []; // [{id, nombre, categoria, activo}]
  let CATEGORIAS = []; // [{nombre, activo}]
  let AREAS = []; // ["TÓRAX", "ABDOMEN", ...]
  let CASOS = [];
  let CONTADOR = 0;

  // Cuando llega una actualización remota (otro equipo guardó/editó/borró algo), se refresca
  // la vista actual sin perder lo que el usuario esté haciendo: los modales son overlays aparte
  // de #main, así que refrescar #main no los cierra ni los interrumpe.
  function refrescarVistaTrasSincronizacion(){
    if(!PERFIL) renderLogin(); else renderMain();
  }

  async function cargarUsuarios(){
    // "usuarios" es ahora una colección real (un documento por persona), separada por completo
    // de la autenticación anónima de Firebase (esa solo identifica al navegador ante las reglas
    // de seguridad; esta es la identidad real dentro de la app — ver comentario en la sección
    // FIREBASE / FIRESTORE más arriba). Lectura inicial confiable + escucha en vivo aparte.
    const items = await cargarColeccionInicial("usuarios");
    suscribirColeccionCambios("usuarios", (nuevos)=>{ USUARIOS = nuevos; refrescarVistaTrasSincronizacion(); });
    return items;
  }
  async function cargarSesionRecordada(){
    // Puramente local a este navegador/dispositivo: nunca debe viajar a Firestore.
    try{ const raw = localStorage.getItem("banco_casos_sesion_recordada"); return raw===null ? null : JSON.parse(raw); }
    catch(e){ return null; }
  }
  async function guardarSesionRecordada(usuarioId){
    localStorage.setItem("banco_casos_sesion_recordada", JSON.stringify(usuarioId));
  }
  async function borrarSesionRecordada(){
    localStorage.removeItem("banco_casos_sesion_recordada");
  }
  async function cargarCatalogo(){
    const items = await cargarColeccionInicial("catalogo_estudios");
    suscribirColeccionCambios("catalogo_estudios", (nuevos)=>{ CATALOGO = nuevos; refrescarVistaTrasSincronizacion(); });
    return items;
  }
  async function guardarCatalogo(cat){
    // _clave / _tokens son cachés de búsqueda calculadas en memoria (ver claveCanonicaDeEntrada /
    // coincideEstudio). Nunca deben persistirse: son datos derivados, no datos reales.
    const limpio = cat.map(({ id, nombre, modalidad, categoria, activo, usos })=> ({ id, nombre, modalidad, categoria, activo, usos: usos||0 }));
    await guardarRegistrosEnLote("catalogo_estudios", limpio);
  }
  async function cargarCategorias(){
    const valor = await cargarDocumentoInicial("configuracion", "categorias");
    suscribirDocumentoCambios("configuracion", "categorias", (nuevo)=>{ CATEGORIAS = nuevo; refrescarVistaTrasSincronizacion(); });
    return valor;
  }
  async function guardarCategorias(cats){
    await guardarDocumento("configuracion", "categorias", cats);
  }
  async function cargarAreas(){
    const valor = await cargarDocumentoInicial("configuracion", "areas");
    suscribirDocumentoCambios("configuracion", "areas", (nuevo)=>{ AREAS = nuevo; refrescarVistaTrasSincronizacion(); });
    return valor;
  }
  async function guardarAreas(areas){
    await guardarDocumento("configuracion", "areas", areas);
  }
  async function cargarCasos(){
    const items = await cargarColeccionInicial("casos");
    suscribirColeccionCambios("casos", (nuevos)=>{ CASOS = nuevos; refrescarVistaTrasSincronizacion(); });
    return items;
  }
  async function guardarCasos(casos){
    // Se usa solo para siembra/migración masiva inicial. El día a día (crear/editar/eliminar
    // UN caso) usa guardarRegistro()/eliminarRegistro() sobre ese único documento — ver el
    // manejador de "Guardar caso" y eliminarCasoPorId().
    await guardarRegistrosEnLote("casos", casos);
  }
  async function cargarContador(){
    return 0; // ya no se usa para generar IDs: ver generarNumeroCasoAtomico(). Se mantiene por compatibilidad.
  }
  async function guardarContador(n){ /* obsoleto: el contador ahora es atómico en Firestore */ }


  function generarIdUsuario(){ return "u_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function generarIdEstudio(){ return "e_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  // Para datos de siembra (catálogo inicial): un id FIJO y determinista a partir del nombre
  // normalizado, no aleatorio. Así, si dos equipos abren la app a la vez con el catálogo vacío
  // y ambos intentan sembrarlo, escriben en el MISMO documento (el segundo simplemente
  // sobrescribe con el mismo contenido) en vez de crear dos registros duplicados.
  function idSemillaEstudio(nombre){ return "seed_" + normKey(nombre).replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, ""); }

  async function init(){
    const app = document.getElementById("app");
    app.innerHTML = '<div class="empty">CARGANDO BIBLIOTECA…</div>';

    // Las 6 lecturas son independientes entre sí: se piden en paralelo (antes se esperaba
    // una por una, sumando la latencia de las 6 en vez de la de la más lenta).
    const [usuariosLeidos, catLeido, categoriasLeidas, areasLeidas, casosLeidos, contadorLeido] = await Promise.all([
      cargarUsuarios(), cargarCatalogo(), cargarCategorias(), cargarAreas(), cargarCasos(), cargarContador()
    ]);

    let usuarios = usuariosLeidos;
    if(!usuarios || usuarios.length===0){
      // Solo se llega aquí si la lectura confiable contra el servidor confirmó que la
      // colección "usuarios" está realmente vacía. Se crea ÚNICAMENTE el documento del
      // administrador — nunca se toca ni se sobrescribe nada más.
      const admin = { id:"admin", nombres:"ADMINISTRADOR", apellidos:"DEL SISTEMA", rol:"ADMINISTRADOR", activo:true };
      await guardarRegistro("usuarios", admin);
      usuarios = [admin];
    }
    USUARIOS = usuarios;

    let cat = catLeido;
    if(!cat || cat.length===0){
      cat = [];
      CATALOGO_INICIAL.forEach(([nombre, modalidad, categoria])=> cat.push({ id: idSemillaEstudio(nombre), nombre, modalidad, categoria: categoria||"GENERAL", activo:true, usos:0 }));
      await guardarCatalogo(cat);
    } else {
      let migrado = false;
      cat.forEach(e=>{
        if(!e.id){ e.id = generarIdEstudio(); migrado = true; }
        if(typeof e.activo !== "boolean"){ e.activo = true; migrado = true; }
        if(typeof e.usos !== "number"){ e.usos = 0; migrado = true; }
        if(!e.modalidad){ e.modalidad = e.categoria || inferirCategoria(e.nombre) || "TOMOGRAFÍA"; migrado = true; }
        if(!e.categoria){ e.categoria = "GENERAL"; migrado = true; }
      });
      if(migrado) await guardarCatalogo(cat);
    }
    CATALOGO = cat;

    let categorias = categoriasLeidas;
    if(!categorias){
      categorias = CATEGORIAS_INICIALES.map(nombre=> ({ nombre, activo:true }));
      await guardarCategorias(categorias);
    }
    // asegurar que toda modalidad en uso por algún estudio exista también en CATEGORIAS (datos legados o creados al vuelo)
    let categoriasCambiaron = false;
    CATALOGO.forEach(e=>{
      if(!categorias.find(c=> c.nombre===e.modalidad)){
        categorias.push({ nombre: e.modalidad, activo:true });
        categoriasCambiaron = true;
      }
    });
    if(categoriasCambiaron) await guardarCategorias(categorias);
    CATEGORIAS = categorias;

    AREAS = areasLeidas || AREAS_INICIAL.slice();
    if(!areasLeidas) await guardarAreas(AREAS);
    CASOS = casosLeidos || [];
    CONTADOR = contadorLeido || 0;

    // Corrige de una vez cualquier duplicado que ya exista en el catálogo (ver
    // limpiarDuplicadosCatalogo). Segura de ejecutar siempre: si ya está limpio, no hace nada.
    await limpiarDuplicadosCatalogo();

    const recordadoId = await cargarSesionRecordada();
    const usuarioRecordado = recordadoId ? USUARIOS.find(u=> u.id===recordadoId && u.activo) : null;
    if(usuarioRecordado){ PERFIL = usuarioRecordado; renderApp(); }
    else{ renderLogin(); }
  }

  /* ============================= APP PRINCIPAL ============================= */
  let TAB = "biblioteca";

  function nombreCompletoPerfil(){ return PERFIL.nombres + " " + PERFIL.apellidos; }

  function puedeEliminarCaso(c){
    return PERFIL.rol === "ADMINISTRADOR" || c.creadoPorId === PERFIL.id;
  }

  // Editar un caso YA CREADO está restringido: solo el administrador o quien lo creó puede
  // modificarlo. Esto NO afecta la creación de casos nuevos (cualquier usuario autorizado
  // sigue pudiendo crear casos con normalidad) — solo la edición posterior de un caso
  // existente. La autoría (aportadoPor / creadoPorId) nunca es editable salvo por el
  // administrador a través del selector de propietario, que también está restringido aparte.
  function puedeEditarCaso(c){
    return !!PERFIL && (PERFIL.rol === "ADMINISTRADOR" || c.creadoPorId === PERFIL.id);
  }

  function casosEnriquecidos(){
    return CASOS.map(c => ({ c, cons: estadoConservacion(c.fechaIngreso) }));
  }

  // Un caso se considera RECIENTE si su fecha de ingreso es de hoy o de ayer (en fecha LOCAL).
  // Distintivo discreto, no afecta el orden ni ningún otro cálculo.
  function esCasoReciente(fechaIngresoISO){
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const d = parseISO(fechaIngresoISO); d.setHours(0,0,0,0);
    const diffDias = Math.round((hoy - d) / 86400000);
    return diffDias >= 0 && diffDias <= 1;
  }

  function medicosUnicos(){
    const set = new Map();
    CASOS.forEach(c=> set.set(c.aportadoPor, c.rol));
    return Array.from(set.entries());
  }

  function filtrarCasos(lista){
    const t = normKey(filtro.texto);
    return lista.filter(({c})=>{
      if(filtro.medico!=="TODOS" && c.aportadoPor!==filtro.medico) return false;
      if(filtro.area!=="TODOS" && c.area!==filtro.area) return false;
      // Comparación directa de texto "YYYY-MM-DD": al ser formato ISO, el orden alfabético
      // coincide exactamente con el orden cronológico, sin necesidad de crear objetos Date
      // (y por lo tanto sin ningún riesgo de desfase de zona horaria).
      if(filtro.desde && c.fechaIngreso < filtro.desde) return false;
      if(filtro.hasta && c.fechaIngreso > filtro.hasta) return false;
      if(t){
        const hay = normKey([c.hcl,c.orden,c.estudio,c.area,c.diagnostico,c.aportadoPor].join(" "));
        if(!hay.includes(t)) return false;
      }
      return true;
    });
  }

          <input type="date" id="f-desde" value="${filtro.desde}">
          <label style="font-size:11.5px; color:var(--ink-soft); font-weight:600;">Hasta</label>
          <input type="date" id="f-hasta" value="${filtro.hasta}">
          ${(filtro.desde || filtro.hasta) ? `<button type="button" class="btn-secondary" id="f-limpiar-fecha" style="padding:8px 10px; font-size:12px;">Limpiar fecha</button>` : ""}
        </div>
      </div>
      <div id="resultados-biblioteca"></div>
    `;
    document.getElementById("btn-nuevo").addEventListener("click", ()=> abrirModalCaso(null));

    const actualizarDebounced = debounce(actualizarResultadosBiblioteca, 150);
    document.getElementById("f-texto").addEventListener("input", e=>{ filtro.texto=e.target.value; actualizarDebounced(); });
    document.getElementById("f-medico").addEventListener("change", e=>{ filtro.medico=e.target.value; actualizarResultadosBiblioteca(); });
    document.getElementById("f-estado").addEventListener("change", e=>{ filtro.estado=e.target.value; actualizarResultadosBiblioteca(); });
    document.getElementById("f-area").addEventListener("change", e=>{ filtro.area=e.target.value; actualizarResultadosBiblioteca(); });

    document.getElementById("f-hasta").addEventListener("change", e=>{ filtro.hasta=e.target.value; renderBiblioteca(); });
    const btnLimpiarFecha = document.getElementById("f-limpiar-fecha");
    if(btnLimpiarFecha) btnLimpiarFecha.addEventListener("click", ()=>{ filtro.desde=""; filtro.hasta=""; renderBiblioteca(); });

    actualizarResultadosBiblioteca();
  }

  // Solo reconstruye la lista de resultados (no la barra de filtros ni el input de búsqueda),
  // así escribir en el buscador NUNCA le quita el foco al campo, ni reconstruye cosas que no cambiaron.
  function actualizarResultadosBiblioteca(){
    const contenedor = document.getElementById("resultados-biblioteca");
    if(!contenedor) return; // la pestaña pudo haber cambiado mientras el debounce esperaba
    let enr = casosEnriquecidos();
    if(filtro.estado!=="TODOS") enr = enr.filter(x=> x.cons.estado===filtro.estado);
    enr = filtrarCasos(enr);
    enr.sort((a,b)=> parseISO(b.c.fechaIngreso) - parseISO(a.c.fechaIngreso));
    contenedor.innerHTML = enr.length===0
      ? `<div class="empty"><h3>No hay casos que coincidan</h3><p>Ajusta la búsqueda o agrega el primer caso docente.</p></div>`
      : tablaCasos(enr);
    bindAccionesCaso(contenedor);
  }

  function estudioEnUso(nombreEstudio){
    return CASOS.some(c=> c.estudio===nombreEstudio);
  }

  function esAdministrador(){ return !!PERFIL && PERFIL.rol === "ADMINISTRADOR"; }
  // Gestionar el catálogo (crear/editar/eliminar estudios) está permitido a ADMINISTRADOR,
  // POSGRADISTA y MÉDICO TRATANTE — misma interfaz, mismos permisos, sin distinción. El resto
  // de acciones exclusivamente administrativas (usuarios, cambiar el propietario de un caso)
  // siguen usando esAdministrador() y no esto.
  function puedeGestionarCatalogo(){ return !!PERFIL && (PERFIL.rol === "ADMINISTRADOR" || PERFIL.rol === "POSGRADISTA" || PERFIL.rol === "MÉDICO TRATANTE"); }

  async function eliminarEstudioPorId(idEstudio, confirmFn){
    if(!puedeGestionarCatalogo()){
      console.error("Eliminar estudio: usuario sin permiso para gestionar el catálogo");
      return { ok:false, motivo:"sin_permiso" };
    }
    confirmFn = confirmFn || confirmarAccion;
    const estudio = CATALOGO.find(e=> e.id===idEstudio);
    if(!estudio){ console.error("Eliminar estudio: no se encontró", idEstudio); return { ok:false, motivo:"no_encontrado" }; }
    if(estudioEnUso(estudio.nombre)){
      console.error("Eliminar estudio: bloqueado, ya está en uso", idEstudio);
      toast("ESTE TIPO DE ESTUDIO NO PUEDE ELIMINARSE PORQUE YA ESTÁ SIENDO UTILIZADO EN CASOS REGISTRADOS.");
      return { ok:false, motivo:"en_uso" };
    }
    if(!(await confirmFn("¿DESEA ELIMINAR ESTE TIPO DE ESTUDIO DEL CATÁLOGO?"))){
      return { ok:false, motivo:"cancelado" };
    }
    const listaAnterior = CATALOGO;
    const listaNueva = CATALOGO.filter(e=> e.id!==idEstudio);
    try{
      await eliminarRegistro("catalogo_estudios", idEstudio);
      CATALOGO = listaNueva;
      return { ok:true };
    }catch(err){
      console.error("Error al eliminar el estudio:", err);
      CATALOGO = listaAnterior;
      toast("NO SE PUDO ELIMINAR EL ESTUDIO. INTENTA DE NUEVO.");
      return { ok:false, motivo:"error_guardado", error: err };
    }
  }

  async function eliminarCasoPorId(idAEliminar, confirmFn, boton){
    confirmFn = confirmFn || confirmarAccion;
    const caso = CASOS.find(c=> c.id === idAEliminar);
    if(!caso){
      console.error("Eliminar caso: no se encontró el caso con id", idAEliminar);
      return { ok:false, motivo:"no_encontrado" };
    }
    if(!puedeEliminarCaso(caso)){
      console.error("Eliminar caso: usuario sin permiso intentó eliminar", idAEliminar, "usuario:", PERFIL && PERFIL.id);
      toast("NO TIENES PERMISO PARA ELIMINAR ESTE CASO");
      return { ok:false, motivo:"sin_permiso" };
    }
    if(!(await confirmFn("¿DESEA ELIMINAR ESTE CASO?\n\nEsta acción no se puede deshacer."))){
      return { ok:false, motivo:"cancelado" };
    }

    const listaAnterior = CASOS;
    const listaNueva = CASOS.filter(c=> c.id !== idAEliminar);
    if(boton) boton.disabled = true;
    try{
      await eliminarRegistro("casos", idAEliminar);
      CASOS = listaNueva;
      toast("CASO ELIMINADO");
      return { ok:true };
    }catch(err){
      console.error("Error al eliminar el caso en el almacenamiento compartido:", err);
      CASOS = listaAnterior;
      if(boton) boton.disabled = false;
      toast("NO SE PUDO ELIMINAR EL CASO. INTENTA DE NUEVO.");
      return { ok:false, motivo:"error_guardado", error: err };
    }
  }

  function bindAccionesCaso(root){
    root.querySelectorAll("[data-del]").forEach(b=>{

    root.querySelectorAll("[data-editar-caso]").forEach(b=>{

        if(!puedeEditarCaso(caso)){ console.error("Editar caso: sin permiso", b.dataset.editarCaso); return; }
        abrirModalCaso(caso);
      });
    });
  }

  function actualizarResultadosRespaldos(){
    const contenedor = document.getElementById("resultados-respaldos");

    let enr = casosEnriquecidos().filter(x=> x.cons.diffDays < 180);

      const enUso = estudiosEnUso.has(e.nombre);
      // MISMA estructura para todos los perfiles siempre (lista en filas). Lo único que cambia
      // según el permiso es si aparecen o no los botones de gestión — nunca el diseño en sí.
      return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border);">

              <button class="btn-secondary" data-editar-estudio="${e.id}" style="padding:4px 10px; font-size:11.5px;">Editar</button>
              ${enUso ? "" : `<button data-eliminar-estudio="${e.id}" title="Eliminar estudio" style="background:none;border:none;color:var(--urgente);font-size:18px;font-weight:800;cursor:pointer;line-height:1;padding:2px 8px;">&times;</button>`}
            </div>` : ""}

    function seccionModalidad(titulo, modalidad){
      const items = CATALOGO.filter(e=> e.modalidad===modalidad && e.activo);
      // Misma condición para todos los perfiles: nunca depende del rol si la sección se muestra.
      const subgrupos = [];
      const vistos = new Set();
      items.forEach(e=>{ if(!vistos.has(e.categoria)){ vistos.add(e.categoria); subgrupos.push(e.categoria); } });
      const usaSubgrupos = modalidad==="TOMOGRAFÍA" && subgrupos.length>1;

      return `

          ${items.length===0
            ? `<div style="font-size:12.5px; color:var(--ink-faint);">Todavía no hay estudios aquí.</div>`
            : usaSubgrupos

                  <div style="margin-bottom:10px;">
                    <div style="font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.02em; margin:8px 0 2px;">${cat}</div>

    main.innerHTML = `
      <div class="panel-head">
        <div>
          <h2>Catálogo de tipos de estudio</h2>
          <p>Busca y selecciona al registrar un caso. Los estudios ya usados en algún caso no se pueden eliminar.</p>

        ${MODALIDADES.map(m=> seccionModalidad(m==="TOMOGRAFÍA" ? "Tomografía (TC)" : m==="RADIOGRAFÍA" ? "Radiografía (RX)" : m==="ECOGRAFÍA" ? "Ecografía (ECO)" : "Resonancia magnética (RM)", m)).join("")}

      <div class="tablewrap" style="padding: 14px 18px;">

  function abrirModalAgregarEstudio(){
    const back = document.createElement("div");
    back.className = "modal-backdrop";
    back.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <div class="modal-header">
          <h3>Agregar estudio</h3>

              ${MODALIDADES.map(m=> `<button type="button" class="btn-secondary" data-modalidad="${m}" style="padding:14px 10px; font-weight:700;">${m}</button>`).join("")}
            </div>
          </div>
        </div>

      </div>`;
    document.body.appendChild(back);
    document.getElementById("ae-close").addEventListener("click", ()=>back.remove());
    document.getElementById("ae-cancel").addEventListener("click", ()=>back.remove());
    back.addEventListener("click", (e)=>{ if(e.target===back) back.remove(); });

    back.querySelectorAll("[data-modalidad]").forEach(b=>{
      b.addEventListener("click", ()=> mostrarPaso2(b.dataset.modalidad));
    });

    function mostrarPaso2(modalidad){
      const sugeridos = estudiosSugeridosPorModalidad(modalidad)
        .filter(([nombre])=> !buscarEstudioDuplicado(nombre, CATALOGO));

      const body = document.getElementById("ae-body");
      body.innerHTML = `
        <div class="field">
          <label>Paso 2 · ${modalidad} — selecciona los estudios que quieres agregar</label>
          ${sugeridos.length===0
            ? `<div class="hint">Ya están todos los estudios sugeridos de esta modalidad en el catálogo.</div>`
            : `<div style="max-height:260px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius);">
                ${sugeridos.map(([nombre],i)=> `
                  <label style="display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:13.5px; border-bottom:1px solid var(--border); cursor:pointer;">
                    <input type="checkbox" class="ae-check" value="${nombre}" data-categoria="${sugeridos[i][2]||'GENERAL'}">
                    ${nombre}
                  </label>`).join("")}
              </div>`}
        </div>
        <div class="field" style="margin-top:14px;">
          <label>+ Agregar otro estudio (opcional)</label>
          <input type="text" id="ae-otro" data-upper placeholder="Nombre de un estudio que no esté en la lista">
        </div>
      `;
      const footer = back.querySelector(".modal-footer");
      footer.innerHTML = `
        <button class="btn-secondary" id="ae-atras">Atrás</button>
        <button class="btn-primary" id="ae-guardar">Agregar</button>
      `;
      document.getElementById("ae-atras").addEventListener("click", ()=> back.remove()); // sencillo: reabrir el asistente si se equivocó de modalidad
      document.getElementById("ae-guardar").addEventListener("click", async ()=>{
        const seleccionados = Array.from(body.querySelectorAll(".ae-check:checked")).map(chk=> ({ nombre: chk.value, categoria: chk.dataset.categoria }));
        const otro = up(document.getElementById("ae-otro").value);
        let otroEraDuplicado = false;
        if(otro){
          if(buscarEstudioDuplicado(otro, CATALOGO)){
            otroEraDuplicado = true;
            toast("ESTE TIPO DE ESTUDIO YA EXISTE EN EL CATÁLOGO.");
          } else {
            seleccionados.push({ nombre: otro, categoria: "GENERAL" });
          }
        }
        // Revalidación final justo antes de escribir: descarta cualquier seleccionado que, en
        // el momento del clic, ya exista (por ejemplo, si otro equipo lo agregó mientras este
        // asistente estaba abierto). Evita crear duplicados por una condición de carrera.
        const yaEnCatalogoAlGuardar = new Set();
        const seleccionadosSinDuplicar = seleccionados.filter(s=>{
          const dup = buscarEstudioDuplicado(s.nombre, CATALOGO);
          if(dup) return false;
          const clave = claveCanonicaEstudio(s.nombre);
          if(yaEnCatalogoAlGuardar.has(clave)) return false; // tampoco duplicar entre sí en la misma tanda
          yaEnCatalogoAlGuardar.add(clave);
          return true;
        });
        if(seleccionadosSinDuplicar.length===0){
          if(!otroEraDuplicado) back.remove();
          return;
        }

        const copiaCatalogoAnterior = CATALOGO.slice();
        const nuevasEntradas = seleccionadosSinDuplicar.map(s=> ({ id: generarIdEstudio(), nombre: s.nombre, modalidad, categoria: s.categoria, activo:true, usos:0 }));
        nuevasEntradas.forEach(e=> CATALOGO.push(e));
        try{
          await guardarRegistrosEnLote("catalogo_estudios", nuevasEntradas);
          back.remove();
          renderCatalogoTab();
        }catch(err){
          console.error("Error al agregar estudios:", err);
          CATALOGO = copiaCatalogoAnterior;
          toast("NO SE PUDO AGREGAR EL ESTUDIO. INTENTA DE NUEVO.");
        }
      });
    }
  }

    back.className = "modal-backdrop";
    back.innerHTML = `

          <div id="ee-duplicado" style="display:none; background: var(--urgente-tint); border:1px solid var(--urgente); border-radius:var(--radius); padding:10px 12px; font-size:12.5px;"></div>
        </div>

          <button class="btn-primary" id="ee-guardar">Guardar cambios</button>
        </div>
      </div>`;
    document.body.appendChild(back);
    uppercaseInputs(back);
    document.getElementById("ee-close").addEventListener("click", ()=>back.remove());
    document.getElementById("ee-cancel").addEventListener("click", ()=>back.remove());
    back.addEventListener("click", (e)=>{ if(e.target===back) back.remove(); });

    document.getElementById("ee-guardar").addEventListener("click", async ()=>{
      const nombreNuevo = up(document.getElementById("ee-nombre").value);
      const modalidadNueva = document.getElementById("ee-modalidad").value;
      const categoriaNueva = up(document.getElementById("ee-categoria").value) || "GENERAL";
      if(!nombreNuevo){ toast("ESCRIBE EL NOMBRE DEL ESTUDIO"); return; }

      const otros = CATALOGO.filter(e=> e.id!==estudioExistente.id);
      const duplicado = buscarEstudioDuplicado(nombreNuevo, otros);
      if(duplicado){
        const aviso = document.getElementById("ee-duplicado");
        aviso.style.display = "block";
        aviso.innerHTML = `ESTE ESTUDIO YA EXISTE COMO:<br><b>${duplicado.nombre}</b>`;
        return;
      }

      const nombreAnterior = estudioExistente.nombre;
      const estadoAnteriorEstudio = { ...estudioExistente };
      const casosAfectados = CASOS.filter(c=> c.estudio===nombreAnterior);
      const estadosAnterioresCasos = casosAfectados.map(c=> ({ ...c }));
      estudioExistente.nombre = nombreNuevo;
      estudioExistente.modalidad = modalidadNueva;
      estudioExistente.categoria = categoriaNueva;
      invalidarCacheEstudio(estudioExistente);
      try{
        if(nombreAnterior !== nombreNuevo && casosAfectados.length>0){
          casosAfectados.forEach(c=> c.estudio = nombreNuevo);
          await guardarRegistrosEnLote("casos", casosAfectados);
        }
        await guardarRegistro("catalogo_estudios", estudioExistente);
        back.remove();
        renderCatalogoTab();
      }catch(err){
        console.error("Error al editar el estudio:", err);
        Object.assign(estudioExistente, estadoAnteriorEstudio);
        invalidarCacheEstudio(estudioExistente);
        casosAfectados.forEach((c,i)=> Object.assign(c, estadosAnterioresCasos[i]));
        toast("NO SE PUDO GUARDAR EL ESTUDIO. INTENTA DE NUEVO.");
      }
    });
  }
